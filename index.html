<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Management Platform</title>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              primary: {"50":"#eff6ff","100":"#dbeafe","200":"#bfdbfe","300":"#93c5fd","400":"#60a5fa","500":"#3b82f6","600":"#2563eb","700":"#1d4ed8","800":"#1e40af","900":"#1e3a8a","950":"#172554"},
              slate: {"50":"#f8fafc","100":"#f1f5f9","200":"#e2e8f0","300":"#cbd5e1","400":"#94a3b8","500":"#64748b","600":"#475569","700":"#334155","800":"#1e293b","900":"#0f172a","950":"#020617"}
            }
          }
        }
      }
    </script>
  <style>
    .holiday-cell {
        background-color: #f3f4f6; /* gray-100 */
        text-align: center;
        vertical-align: middle;
        position: relative;
    }
    .holiday-cell .rotate-text {
        writing-mode: vertical-rl;
        text-orientation: mixed;
        white-space: nowrap;
        transform: rotate(180deg);
        font-weight: bold;
        color: #4b5563; /* gray-600 */
        font-size: 9px;
    }
    @media print {
      body {
        background-color: #fff;
      }
      body * {
        visibility: hidden;
      }
      #report-section, #report-section *,
      #intervention-agreement-print-section, #intervention-agreement-print-section *,
      #vicc-agreement-print-section, #vicc-agreement-print-section *,
      #medical-certificate-print-section, #medical-certificate-print-section *,
      #schedule-print-section, #schedule-print-section *,
      #exit-pass-print-section, #exit-pass-print-section *,
      #citacion-print-section, #citacion-print-section *,
      #leccionario-print-section, #leccionario-print-section *,
      #attendance-matrix-section, #attendance-matrix-section *,
      #daily-attendance-report-section, #daily-attendance-report-section * {
        visibility: visible;
      }
      #report-section, 
      #intervention-agreement-print-section, 
      #vicc-agreement-print-section, 
      #medical-certificate-print-section, 
      #schedule-print-section,
      #exit-pass-print-section,
      #citacion-print-section,
      #leccionario-print-section,
      #attendance-matrix-section,
      #daily-attendance-report-section {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
        box-shadow: none;
        border: none;
      }
      #report-section .no-print,
      #intervention-agreement-print-section .no-print,
      #vicc-agreement-print-section .no-print,
      #medical-certificate-print-section .no-print,
      #schedule-print-section .no-print,
      #exit-pass-print-section .no-print,
      #citacion-print-section .no-print,
      #leccionario-print-section .no-print,
      #attendance-matrix-section .no-print,
      #daily-attendance-report-section .no-print {
        display: none !important;
      }
      .holiday-cell {
        background-color: #f3f4f6 !important;
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact;
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/"
  }
}
</script>
</head>
  <body class="bg-slate-50 font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
